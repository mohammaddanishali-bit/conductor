global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'conductor'
    environment: 'local'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Conductor Server metrics
  - job_name: 'conductor-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['conductor-server:8080']
        labels:
          service: 'conductor-server'
          component: 'api'
    scrape_interval: 10s

  # Conductor Sweeper metrics
  - job_name: 'conductor-sweeper'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['conductor-sweeper:8080']
        labels:
          service: 'conductor-sweeper'
          component: 'sweeper'
    scrape_interval: 10s

  # PostgreSQL metrics (if using postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis metrics (if using redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
